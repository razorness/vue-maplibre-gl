# Groups rather than an allowlist: the previous config only ever offered updates for maplibre-gl, vue
# and typescript, which is how the rest of the toolchain fell four years behind. Everything is in scope
# now, batched so a week produces a handful of PRs instead of thirty.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      maplibre:
        patterns: ['maplibre-gl', '@maplibre/*']
      vue:
        patterns: ['vue', 'vue-tsc', '@vue/*', 'vue-component-meta', 'vitepress']
      turf:
        patterns: ['@turf/*']
      linting:
        patterns: ['oxlint*', 'eslint*', '@eslint/*', 'prettier*', '@ianvs/*', 'globals']
      build-and-test:
        patterns: ['vite', 'vite-*', 'vitest', '@vitest/*', 'rollup', 'jsdom', 'typescript', 'publint', '@arethetypeswrong/*']
      types:
        patterns: ['@types/*']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns: ['*']
